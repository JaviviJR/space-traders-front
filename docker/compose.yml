name: space-trader-front
services:
    node:
        command: sleep infinity
        build: ./node
        mem_limit: 2048m
        volumes:
            - ${APP_DIR}:/home/ubuntu/app
        working_dir: /home/ubuntu/app
        user: ${CONTAINER_USER:-1000:1000}
        network_mode: host
        # ports:
        #     - ${APP_PORT}:5173

