schema_version: "1.0"

preset:
  id: "dual-research"
  name: "Dual research"
  version: "1.0.0"
  description: "Experimental: /speckit-plan also writes research.workflow.md under the project's rules, to compare with spec-kit's default research.md"

requires:
  speckit_version: ">=1.2.5"

provides:
  templates:
    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      strategy: "append"
