schema_version: "1.0"

preset:
  id: "project-workflow"
  name: "Project workflow"
  version: "1.0.0"
  description: "Decisions presented as options in clarify and plan, and task lists for one developer"

requires:
  speckit_version: ">=1.2.5"

provides:
  templates:
    - type: "command"
      name: "speckit.clarify"
      file: "commands/speckit.clarify.md"
      strategy: "append"
    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      strategy: "append"
    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-template.md"
      strategy: "append"
