<!doctype html>
<html lang="es" class="app-dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Opción 2: host único</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #0f172a; color: #94a3b8; }
      .url { font-family: monospace; font-size: 13px; background: #020617; color: #cbd5e1; padding: 8px 16px; }
      header { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid #1e293b; }
      header strong { color: #fff; }
      .hero { max-width: 40rem; margin: 64px auto; padding: 0 16px; text-align: center; }
      .hero h1 { color: #fff; }
      .sim { position: fixed; right: 16px; bottom: 16px; background: #1e293b; border: 1px dashed #475569; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
      .stack { display: flex; flex-direction: column; gap: 12px; }
      .center { text-align: center; }
      .fade-enter-active, .fade-leave-active { transition: opacity 0.15s; }
      .fade-enter-from, .fade-leave-to { opacity: 0; }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <!-- Same versions as package-lock.json; theme script must load after PrimeVue (v4.primevue.org/cdn.md). -->
    <script src="https://unpkg.com/vue@3.5.43/dist/vue.global.prod.js"></script>
    <script src="https://unpkg.com/primevue@4.5.5/umd/primevue.min.js"></script>
    <script src="https://unpkg.com/@primevue/themes@4.5.4/umd/aura.min.js"></script>
    <script>
      const { createApp, ref, shallowRef, onMounted } = Vue

      // Fake back: resolves 'confirmed' or 'invalid' after a delay.
      const fakeConfirm = (outcome) =>
        new Promise((resolve) => setTimeout(() => resolve(outcome), 1200))

      const url = ref('localhost:5173/')
      const animate = ref(true)

      // --- The host's state: in the app this would be useModal() ---
      const visible = ref(false)
      const current = shallowRef(null) // { name, props }

      function open(name, props = {}) {
        current.value = { name, props }
        visible.value = true
      }
      function close() {
        visible.value = false
      }

      // --- Contents: plain components, they don't know they live in a dialog ---
      const AuthContent = {
        props: { tab: { type: String, default: 'login' } },
        setup(props) {
          const active = ref(props.tab)
          const email = ref('ripley@nostromo.test')
          return { active, email, open }
        },
        template: `
          <Tabs v-model:value="active">
            <TabList><Tab value="login">Iniciar sesión</Tab><Tab value="register">Crear cuenta</Tab></TabList>
            <TabPanels>
              <TabPanel value="login">
                <div class="stack">
                  <InputText placeholder="Email" /><InputText placeholder="Contraseña" type="password" />
                  <Button label="Entrar" />
                </div>
              </TabPanel>
              <TabPanel value="register">
                <div class="stack">
                  <InputText v-model="email" placeholder="Email" />
                  <Button label="Crear cuenta" @click="open('registerSuccess', { email })" />
                </div>
              </TabPanel>
            </TabPanels>
          </Tabs>`,
      }

      const RegisterSuccess = {
        props: { email: String },
        setup: () => ({ close }),
        template: `
          <div class="stack center">
            <p>Hemos enviado un enlace de confirmación a <strong>{{ email }}</strong>.</p>
            <Button label="Entendido" @click="close" />
          </div>`,
      }

      const ConfirmEmail = {
        props: { outcome: String },
        setup(props) {
          const status = ref('pending')
          onMounted(async () => {
            status.value = await fakeConfirm(props.outcome)
            url.value = 'localhost:5173/' // router.replace('/'): the dialog stays open
          })
          return { status, open, close }
        },
        template: `
          <div class="stack center">
            <p v-if="status === 'pending'">Confirmando tu cuenta…</p>
            <template v-else-if="status === 'confirmed'">
              <p>Tu cuenta está confirmada. Ya puedes iniciar sesión.</p>
              <Button label="Iniciar sesión" @click="open('auth', { tab: 'login' })" />
            </template>
            <template v-else>
              <Message severity="error" :closable="false">El enlace no es válido o ha caducado.</Message>
              <p>(Aquí iría el formulario de reenvío, sub-bloque 2.)</p>
              <Button label="Cerrar" severity="secondary" @click="close" />
            </template>
          </div>`,
      }

      // Typed registry in the app: name -> component + header.
      const registry = {
        auth: { component: AuthContent, header: 'Accede a SpaceTraders' },
        registerSuccess: { component: RegisterSuccess, header: 'Revisa tu correo' },
        confirmEmail: { component: ConfirmEmail, header: 'Confirmar email' },
      }

      // --- The host: the only Dialog, renders whatever content is current ---
      const ModalHost = {
        setup() {
          return { visible, current, registry, animate, afterHide: () => (current.value = null) }
        },
        template: `
          <Dialog v-model:visible="visible" modal :draggable="false" :style="{ width: '28rem' }"
                  :header="current ? registry[current.name].header : ''" @after-hide="afterHide">
            <Transition :name="animate ? 'fade' : ''" mode="out-in">
              <component v-if="current" :is="registry[current.name].component" :key="current.name" v-bind="current.props" />
            </Transition>
          </Dialog>`,
      }

      const App = {
        components: { ModalHost },
        setup() {
          function simulateLink(outcome) {
            url.value = 'localhost:5173/confirm-email?id=1&expires=…&token=…&signature=…'
            open('confirmEmail', { outcome })
          }
          return { url, animate, open, simulateLink }
        },
        template: `
          <div class="url">{{ url }}</div>
          <header><strong>SpaceTraders</strong><Button label="Empezar" @click="open('auth', { tab: 'register' })" /></header>
          <section class="hero"><h1>Opción 2: un único diálogo</h1>
            <p>El contenido cambia dentro del mismo Dialog: registro → éxito, confirmación → login. Nunca se cierra para pasar de un paso a otro.</p>
          </section>
          <div class="sim"><strong>Simulador</strong>
            <Button size="small" label="Abrir enlace del email" @click="simulateLink('confirmed')" />
            <Button size="small" severity="secondary" label="Abrir enlace caducado" @click="simulateLink('invalid')" />
            <label><input type="checkbox" v-model="animate" /> Fundido al cambiar de contenido</label>
          </div>
          <ModalHost />`,
      }

      const app = createApp(App)
      app.use(PrimeVue.Config, { theme: { preset: PrimeVue.Themes.Aura, options: { darkModeSelector: '.app-dark' } } })
      for (const name of ['Dialog', 'Button', 'InputText', 'Message', 'Tabs', 'TabList', 'Tab', 'TabPanels', 'TabPanel']) {
        app.component(name, PrimeVue[name])
      }
      app.mount('#app')
    </script>
  </body>
</html>
